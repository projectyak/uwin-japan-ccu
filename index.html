<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UWin·Japan | Visitor Registration</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="stylesheet" href="colors_and_type.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ccu-bg); color: var(--ccu-fg);
      font-family: var(--ccu-font-sans); font-size: 15px;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Nav (mirrors index.html) ─────────────────────────── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(18px) saturate(1.1);
      border-bottom: 1px solid var(--ccu-line);
      height: 64px;
      display: flex; align-items: center;
      padding: 0 20px;
    }
    .nav-inner { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 0; }
    .nav-logo { display: flex; align-items: center; gap: 10px; }
    .nav-cta { margin-left: auto; display: flex; gap: 10px; align-items: center; }

    /* ── Language switcher ────────────────────────────────── */
    .nav-lang { display: inline-flex; align-items: center; gap: 0; margin-left: 14px; padding: 3px; background: #fff; border: 1px solid var(--ccu-line); border-radius: 999px; }
    .nav-lang button {
      font-family: var(--ccu-font-sans); font-size: 11px; font-weight: 600;
      background: transparent; color: var(--ccu-fg-2);
      border: none; cursor: pointer; padding: 5px 11px;
      border-radius: 999px; line-height: 1; letter-spacing: 0.02em;
      transition: background var(--ccu-dur-fast), color var(--ccu-dur-fast);
    }
    .nav-lang button:hover { color: var(--pwc-orange); }
    .nav-lang button.active { background: var(--pwc-orange); color: #fff; }

    /* ── Section shared (mirrors index.html) ──────────────── */
    .section-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--pwc-orange);
      margin-bottom: 14px; display: inline-block;
      padding-bottom: 6px; border-bottom: 2px solid var(--pwc-orange);
    }
    .section-h2 {
      font-family: var(--ccu-font-display); font-weight: 400;
      font-size: clamp(32px, 3vw, 44px); letter-spacing: -0.005em;
      line-height: 1.1; color: var(--ccu-ink); text-wrap: balance;
    }
    .section-h2 em { font-style: italic; color: var(--pwc-orange); font-weight: 400; }
    .section-lead { font-size: 17px; color: var(--ccu-fg-2); line-height: 1.55; margin-top: 14px; }

    /* ── Gate layout ──────────────────────────────────────── */
    .gate-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 48px 20px;
      background:
        radial-gradient(50% 55% at 80% 30%, rgba(208,74,2,0.10), transparent 72%),
        radial-gradient(40% 50% at 92% 85%, rgba(255,182,0,0.08), transparent 75%),
        #fff;
    }

    /* ── Contact-style form (mirrors index.html) ──────────── */
    .contact-section { width: 100%; padding: 56px 20px; background: transparent; }
    .contact-inner { max-width: 640px; margin: 0 auto; text-align: center; }
    .contact-form { margin-top: 40px; text-align: left; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 700; color: var(--ccu-fg); display: block; letter-spacing: 0.04em; }
    .form-input {
      font-family: var(--ccu-font-sans); font-size: 14px;
      padding: 11px 14px; border: 1px solid var(--ccu-line-2);
      border-radius: 2px; background: #fff; color: var(--ccu-fg);
      outline: none; width: 100%;
      transition: border-color var(--ccu-dur-fast), box-shadow var(--ccu-dur-fast);
    }
    .form-input:focus { border-color: var(--pwc-orange); box-shadow: var(--ccu-shadow-focus); }
    .form-input::placeholder { color: var(--ccu-fg-3); }
    .btn-submit {
      width: 100%; font-family: var(--ccu-font-sans);
      font-weight: 700; font-size: 14px;
      background: var(--pwc-orange); color: #fff;
      border: none; cursor: pointer;
      padding: 13px 20px; border-radius: 2px;
      margin-top: 8px; line-height: 1;
      letter-spacing: 0.02em;
      transition: background var(--ccu-dur-fast);
    }
    .btn-submit:hover { background: var(--pwc-orange-dark-1); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    @media (max-width: 768px) {
      .form-row {
        display: flex !important;
        flex-direction: column !important;
        gap: 0 !important;
      }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-logo">
        <img src="logo.png" alt="UWin Japan" style="height:36px;width:auto;display:block;">
      </div>
      <div class="nav-cta">
        <div class="nav-lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ja">日</button>
          <button type="button" data-lang="zh">中</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="gate-wrap">
    <section class="contact-section">
      <div class="contact-inner">
        <div class="section-eyebrow" data-i18n="gateEyebrow">Visitor registration</div>
        <h2 class="section-h2" style="text-align:center;" data-i18n-html="gateH2">Welcome to <em>UWin·Japan</em></h2>
        <p class="section-lead" style="margin:14px auto 0;text-align:center;" data-i18n="gateLead">Please register for more details.</p>

        <form class="contact-form" id="gate-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" data-i18n="fName">Name</label>
              <input class="form-input" type="text" name="name" placeholder="Tanaka Keiji" data-i18n-placeholder="fNamePh" required>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="fEmail">Email</label>
              <input class="form-input" type="email" name="email" placeholder="tanaka@steel-co.jp" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" data-i18n="fCompany">Company</label>
              <input class="form-input" type="text" name="company" placeholder="Santon Steel Corp." data-i18n-placeholder="fCompanyPh" required>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="fTitle">Title</label>
              <input class="form-input" type="text" name="title" placeholder="Sustainability Manager" data-i18n-placeholder="fTitlePh" required>
            </div>
          </div>
          <button type="submit" class="btn-submit" data-i18n-html="gateSubmit">Enter site &rarr;</button>
        </form>
      </div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script>lucide.createIcons();</script>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlnnCVvpzR1w2MhDYojxUP_AWNntzbtqaMqs-3mOsEyC4UrR73zmpL-pCQL0BR646Dcg/exec';

    document.getElementById('gate-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const form = this;
      const btn = form.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      const fd = new FormData(form);
      fd.append('form_type', 'visitor_gate');

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: fd,
        mode: 'no-cors'
      }).finally(() => {
        window.location.href = 'home.html';
      });
    });
  </script>

</body>
</html>
